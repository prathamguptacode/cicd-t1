name: Deploy

on:
   push:
      branches:
       - main

jobs:
   deploy:
      runs-on: ubuntu-latest

      steps:
       - name: checkout code
         uses: actions/checkout@v4

       - name: ssh
         uses: appleboy/ssh-action@v1.0.3
         with:
            host: 13.52.181.108
            username: root
            key: ${{secret.SSH_KEY}}
            script: |
               cd /home/ubuntu/cicd-t1
               git pull
               npm i
               node server.js
